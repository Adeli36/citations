name: Envoi d'une citation

on:
  workflow_dispatch:

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers du dépôt
        uses: actions/checkout@v4

      - name: Envoyer une citation au hasard
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_APP_ID: "4803d465-d2d3-4968-b996-b572570a759a"
        run: |
          CITATION=$(jq -r '.[]' citations.json | shuf -n 1)
          echo "Citation choisie : $CITATION"
          CORPS=$(jq -n --arg app "$ONESIGNAL_APP_ID" --arg msg "$CITATION" '{app_id: $app, target_channel: "push", included_segments: ["Subscribed Users"], headings: {en: "Ma dose de motivation"}, contents: {en: $msg}, url: "https://adeli36.github.io/citations/"}')
          curl --silent --show-error --fail-with-body --request POST --url https://api.onesignal.com/notifications --header "Authorization: Key $ONESIGNAL_API_KEY" --header "Content-Type: application/json" --data "$CORPS"
